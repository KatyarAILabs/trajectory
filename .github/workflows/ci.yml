name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # A real S3 API for the sink tests. Without it they skip, which is fine
      # for a contributor's laptop and not fine for CI: the S3 sink is the
      # production sink.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=trajectory -e MINIO_ROOT_PASSWORD=trajectory-secret \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do curl -sf localhost:9000/minio/health/ready && break; sleep 1; done
          docker exec minio mkdir -p /data/lake

      - run: make build
      - run: make test
        env:
          TRAJECTORY_S3_ENDPOINT: http://127.0.0.1:9000
          TRAJECTORY_S3_BUCKET: lake
          AWS_ACCESS_KEY_ID: trajectory
          AWS_SECRET_ACCESS_KEY: trajectory-secret
      - run: make lint

      # Assembly, redaction and the sink all mutate shared counters from
      # multiple goroutines. A data race there is a wrong metric or a lost
      # episode, neither of which surfaces as a test failure on its own.
      - run: go test -race ./...

  generated:
    # The protos are the source of truth. A PR that edits a .proto without
    # committing the regenerated Go and JSON Schema would publish a contract
    # that does not match the code (F-10.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: arduino/setup-protoc@v3
        with:
          version: '25.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: make tools
      - run: make verify-generated

  security:
    # F-12.2 is enforced by a lint on log call sites rather than by review,
    # because a payload in a debug log is invisible until someone enables debug
    # logging in production — at which point prompts and tool arguments are in
    # a log aggregator a much larger set of people can read.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: make logcheck

  container:
    # F-12.5: the image must build, and must be non-root with no shell.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trajectory:ci .
      - name: Assert non-root and no shell
        run: |
          user=$(docker inspect -f '{{.Config.User}}' trajectory:ci)
          if [ "$user" = "" ] || [ "$user" = "root" ] || [ "$user" = "0:0" ]; then
            echo "::error::image runs as root (user=$user); F-12.5 requires non-root"
            exit 1
          fi
          echo "image user: $user"
          if docker run --rm --entrypoint /bin/sh trajectory:ci -c 'echo reachable' 2>/dev/null; then
            echo "::error::image contains a shell; a distroless base must not"
            exit 1
          fi
          echo "no shell in the image"

  conformance:
    # §18: the conformance suite is the definition of compliance. If a schema
    # change breaks a reader, it breaks the published sample dataset first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: make conform

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/trajectory/
      - name: Assert the rendered pod is non-root and read-only
        run: |
          helm template t deploy/helm/trajectory/ --set config.tenant=ci \
            > /tmp/rendered.yaml
          python3 - <<'PY'
          import yaml, sys
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          ss = [d for d in docs if d['kind'] == 'StatefulSet'][0]
          spec = ss['spec']['template']['spec']
          sc = spec['containers'][0]['securityContext']
          problems = []
          if not spec['securityContext'].get('runAsNonRoot'):
              problems.append('runAsNonRoot is not set')
          if not sc.get('readOnlyRootFilesystem'):
              problems.append('readOnlyRootFilesystem is not set')
          if sc.get('allowPrivilegeEscalation'):
              problems.append('allowPrivilegeEscalation is true')
          if sc.get('capabilities', {}).get('drop') != ['ALL']:
              problems.append('capabilities are not all dropped')
          if problems:
              print('F-12.5 violations in the rendered chart:')
              for p in problems:
                  print('  -', p)
              sys.exit(1)
          print('rendered pod meets F-12.5')
          PY

  otel-exporter:
    # A separate Go module, so the OTel Collector framework is not pulled into
    # the standalone binary. It is built and tested on its own, and a real
    # distribution is compiled from the builder manifest so the manifest
    # cannot rot unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Test the exporter module
        working-directory: otelcol/trajectoryexporter
        run: go test ./...
      - name: Licence gate for the exporter module
        working-directory: otelcol/trajectoryexporter
        run: go run ../../tools/licensecheck
      - name: Build an OTel Collector distribution
        working-directory: otelcol
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.161.0
          mkdir -p dist
          builder --config builder-config.yaml
          ./dist/trajectory-otelcol/trajectory-otelcol components | grep -q 'name: trajectory'

  sdk-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - working-directory: sdk/python
        run: python -m unittest discover -s tests -v

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: sdk/typescript
        run: npm install && npm test

  licences:
    # §13 and F-12.4: permissive licences only. This gate exists from the first
    # commit so a non-permissive transitive dependency can never become
    # established and expensive to remove.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - run: make licences

  sbom:
    # F-12.4: an SBOM accompanies every build, not only tagged releases, so a
    # dependency change is visible in the PR that introduces it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: trajectory-sbom.spdx.json

  dco:
    # §18: DCO sign-off, not a CLA.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha is missing a Signed-off-by line"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          exit $missing
