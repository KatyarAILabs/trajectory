[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-sdk"
version = "0.1.0"
description = "Emit agent trajectories to a trajectory collector"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
# No dependencies, deliberately: a telemetry SDK that drags a dependency tree
# into an ML codebase conflicts with something sooner or later.
dependencies = []

[tool.setuptools]
packages = ["trajectory"]
