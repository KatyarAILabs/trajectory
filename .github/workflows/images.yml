#
# Builds the container images and pushes them to GitHub Container Registry.
#
#   ghcr.io/katyarailabs/trajectory          the standalone collector (cc)
#   ghcr.io/katyarailabs/trajectory-otelcol  the OTel Collector distribution
#
# Tags:
#   push to main   ->  :main, :sha-<short>
#   tag v1.2.3     ->  :1.2.3, :1.2, :latest, :sha-<short>
#   pull request   ->  built for both platforms, not pushed
#
# Pushed images are signed with keyless Sigstore by digest, like the release
# binaries, so a consumer can verify they came from this workflow.

name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  # Required for keyless signing.
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trajectory
            dockerfile: Dockerfile
          - name: trajectory-otelcol
            dockerfile: otelcol/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        # GHCR repository names must be lower case; the org is KatyarAILabs.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
