#
# A minimal OTel Collector distribution with the trajectory exporter.
# Build:  builder --config otelcol/builder-config.yaml

dist:
  name: trajectory-otelcol
  description: OpenTelemetry Collector with the trajectory exporter
  output_path: ./dist/trajectory-otelcol
  version: 0.1.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.161.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.161.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.161.0

exporters:
  - gomod: github.com/KatyarAILabs/trajectory/otelcol/trajectoryexporter v0.1.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.161.0

# Resolve both modules from this checkout while they are unpublished.
# Paths are relative to the generated module at dist.output_path
# (otelcol/dist/trajectory-otelcol), not to this file. Build from otelcol/:
#   mkdir -p dist && builder --config builder-config.yaml
replaces:
  - github.com/KatyarAILabs/trajectory => ../../..
  - github.com/KatyarAILabs/trajectory/otelcol/trajectoryexporter => ../../trajectoryexporter
