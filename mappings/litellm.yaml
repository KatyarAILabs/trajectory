# LiteLLM proxy, via its `generic_api` logging callback.
#
# Written against LiteLLM 1.102.0's StandardLoggingPayload, captured from a
# running proxy (spec/testdata/litellm-standard-logging-payload.json) rather
# than from documentation. An earlier version of this file was written from
# memory and missed the session, every sampling parameter and both timestamps.
#
# Configure LiteLLM:
#
#   litellm_settings:
#     callbacks: ["generic_api"]
#   environment:
#     GENERIC_LOGGER_ENDPOINT: http://<collector>:<port>/v1/hooks/litellm
#     GENERIC_LOGGER_HEADERS: "Authorization=Bearer <token>"
#
# and have callers send `litellm_session_id` (or `metadata.session_id`) so the
# calls of one agent run group into one episode.
#
# What a gateway can and cannot see decides whether this path is enough:
#   - it sees every model call, its parameters (including seed), tokens, cost
#     and failures;
#   - it sees tool calls only through the conversation: the model's requested
#     arguments and the results fed back as `role: tool` messages. These are
#     rebuilt into tool steps (tool_steps below), so entity extraction works,
#     but there is no tool version and no tool timing, because the tool ran in
#     the application, out of the gateway's sight.

name: litellm
version: "1.102"

kind: fixed
fixed_kind: llm

# Rebuild tool steps from OpenAI-format message history.
tool_steps: openai_messages

# Top-level fields never kept in raw. They identify the caller, not the
# trajectory, and raw is subject only to the redaction policy.
exclude:
  - requester_ip_address
  - user_agent
  - end_user

fields:
  span_id:
    - "$.litellm_call_id"
    - "$.id"
  session_key:
    - "$.trace_id"
    - "$.session_id"
    - "$.metadata.requester_metadata.session_id"
  task_type:
    - "$.metadata.requester_metadata.task_type"
  group_id:
    - "$.metadata.requester_metadata.group_id"

  # LiteLLM cannot know when an agent run ends, so without this an episode
  # closes only when the assembly window expires, marked timed_out. Send
  # metadata {"episode_end": true} on the run's final call to close it
  # promptly and mark it complete.
  episode_end:
    - "$.metadata.requester_metadata.episode_end"

  input:
    - "$.messages"
  output:
    - "$.response.choices"

  # The model actually called, not the proxy alias; the alias is kept in raw
  # as model_group.
  model:
    - "$.model"
  provider:
    - "$.custom_llm_provider"
  finish_reason:
    - "$.response.choices[0].finish_reason"

  temperature:
    - "$.model_parameters.temperature"
  top_p:
    - "$.model_parameters.top_p"
  max_tokens:
    - "$.model_parameters.max_tokens"
    - "$.model_parameters.max_completion_tokens"
  seed:
    - "$.model_parameters.seed"

  token_input:
    - "$.prompt_tokens"
    - "$.response.usage.prompt_tokens"
  token_output:
    - "$.completion_tokens"
    - "$.response.usage.completion_tokens"

  cost:
    - "$.response_cost"

  # Present and non-empty only when the call failed.
  error:
    - "$.error_str"

  started_at:
    - "$.startTime"
  ended_at:
    - "$.endTime"
