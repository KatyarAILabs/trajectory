#
# F-12.4: signed release artifacts and an SBOM.
#
# Signing uses keyless Sigstore, so there is no long-lived private key for
# anyone to lose or steal. The identity bound into the signature is this
# workflow in this repository, which is what a consumer verifies against.
#
# Container images for a tag are built, pushed and signed by images.yml.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Required for keyless signing.
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="cc-${{ matrix.goos }}-${{ matrix.goarch }}"
          # -trimpath so the binary does not embed build paths, which are
          # both noise and a small information leak.
          go build -trimpath \
            -ldflags="-s -w \
              -X github.com/KatyarAILabs/trajectory/internal/version.Collector=${version} \
              -X github.com/KatyarAILabs/trajectory/internal/version.Commit=${GITHUB_SHA::8}" \
            -o "dist/${out}" ./cmd/cc
          (cd dist && sha256sum "${out}" > "${out}.sha256")

      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: |
          out="cc-${{ matrix.goos }}-${{ matrix.goarch }}"
          cosign sign-blob --yes \
            --output-signature "dist/${out}.sig" \
            --output-certificate "dist/${out}.pem" \
            "dist/${out}"

      - uses: actions/upload-artifact@v4
        with:
          name: cc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: trajectory-sbom.spdx.json
          output-file: trajectory-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: trajectory-sbom.spdx.json

  publish:
    needs: [binaries, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            ## Verifying this release

            Binaries and the container images are signed with keyless Sigstore.
            There is no long-lived signing key; the identity bound into the
            signature is the release workflow in this repository.

            ```sh
            cosign verify-blob \
              --certificate cc-linux-amd64.pem \
              --signature cc-linux-amd64.sig \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              cc-linux-amd64
            ```

            An SPDX SBOM is attached.

            ## Schema compatibility

            Readers built against an earlier `0.x` minor version read this
            release's files without modification: changes within a major
            version are additive only.
